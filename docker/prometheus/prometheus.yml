# INFRA-011 D1: what Prometheus reads, every 60 s — the APIs' request latency per route
# (core/middleware/observe.go), the taypi_* gauges and Go runtime, PostgreSQL through
# postgres-exporter, and the host through node-exporter. alerts.yml is evaluated on the same
# 60 s and what fires goes to Alertmanager (INFRA-018, docker/README.md → Alerts).
global:
  scrape_interval: 60s
  evaluation_interval: 60s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api-platform:9100"]
        labels: { role: api }
      - targets: ["api-realtime:9100"]
        labels: { role: realtime }
      - targets: ["api-worker:9100"]
        labels: { role: worker }
      - targets: ["api-scheduler:9100"]
        labels: { role: scheduler }
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
