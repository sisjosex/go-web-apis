name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Go version comes from the `go` directive in go.mod, like the Dockerfile.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Every package, tools included: the dev build keeps /swagger.
      - name: build (dev)
        run: go build ./...

      # The production binaries exactly as the Dockerfile builds them.
      - name: build (production)
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -tags noswagger -ldflags="-s -w" -o bin/server ./cmd/server
          go build -trimpath -tags noswagger -ldflags="-s -w" -o bin/cli ./cmd/cli
