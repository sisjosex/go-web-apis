name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Go version comes from the `go` directive in go.mod, like the Dockerfile.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Every package, tools included: the dev build keeps /swagger.
      - name: build (dev)
        run: go build ./...

      # The production binaries exactly as the Dockerfile builds them.
      - name: build (production)
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -tags noswagger -ldflags="-s -w" -o bin/server ./cmd/server
          go build -trimpath -tags noswagger -ldflags="-s -w" -o bin/cli ./cmd/cli

  # The production image, from master only: ghcr.io/sisjosex/api:<commit sha> and :latest.
  # The package inherits the repo's private visibility. The server pulls it
  # (docker/README.md → Deploy) instead of compiling on the box.
  image:
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Layers cached in GitHub: a source change rebuilds from the compile step on.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/sisjosex/api:${{ github.sha }}
            ghcr.io/sisjosex/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
