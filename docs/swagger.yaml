      security:
      - ApiKeyAuth: []
      summary: Import limits
      tags:
      - Import
  /import/resources:
    get:
      description: Lists the import resources a scope of resource or module keys reaches,
        with the module that owns each, in detection order. An empty scope lists every
        registered resource.
      parameters:
      - description: Bearer Token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Tenant slug
        in: header
        name: X-Tenant-Slug
        required: true
        type: string
      - description: Comma-separated resource or module keys (e.g. inventory)
        in: query
        name: scope
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
