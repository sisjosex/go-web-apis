basePath: /api/v1
definitions:
  errors.ErrorResponse:
    properties:
      code:
        description: |-
          Error code
          example: 400
        type: string
      detail:
        description: |-
          Error details
          example: {"email": "Invalid email format"}
      error:
        description: |-
          Error message
          example: Bad Request
      message:
        description: Translated error message
    type: object
  josex_web_modules_auth_models.CreateUserDto:
    properties:
      bio:
        type: string
      birthday:
        type: string
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      password:
        type: string
      phone:
        type: string
      profile_picture_url:
        type: string
      website_url:
        type: string
    required:
    - email
    - first_name
    - last_name
    - password
    type: object
  models.ChangePasswordRequestDto:
    properties:
      password_current:
        type: string
      password_new:
        type: string
    required:
    - password_current
    - password_new
    type: object
  models.LoginExternalRequestDto:
    properties:
      auth_provider_id:
        type: string
      birthday:
        type: string
      device_id:
        type: string
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      phone:
        type: string
    required:
    - auth_provider_id
    type: object
  models.LoginSuccessResponse:
    properties:
      access_token:
        description: JWT token
        type: string
      refresh_token:
        description: JWT token
        type: string
    type: object
  models.LoginUserRequestDto:
    properties:
      device_id:
        type: string
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  models.PasswordResetRequestDto:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  models.PasswordResetTokenRequestDto:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  models.PasswordResetWithTokenDto:
    properties:
      password_new:
        type: string
      token:
        type: string
    required:
    - password_new
    - token
    type: object
  models.RefreshTokenRequestDto:
    properties:
      refresh_token:
        description: JWT token
        type: string
    type: object
  models.RefreshTokenResponse:
    properties:
      access_token:
        description: JWT token
        type: string
    type: object
  models.SoftDeleteUserDto:
    properties:
      id:
        type: string
      reason:
        description: Optional deletion reason
        maxLength: 500
        type: string
    required:
    - id
    type: object
  models.UpdateProfileDto:
    properties:
      bio:
        type: string
      birthday:
        type: string
      first_name:
        type: string
      id:
        type: string
      last_name:
        type: string
      password_current:
        type: string
      password_new:
        type: string
      phone:
        type: string
      profile_picture_url:
        type: string
      website_url:
        type: string
    type: object
  models.User:
    properties:
      bio:
        type: string
      birthday:
        type: string
      email:
        type: string
      first_name:
        type: string
      id:
        type: string
      last_name:
        type: string
      phone:
        type: string
      profile_picture_url:
        type: string
      website_url:
        type: string
    required:
    - email
    - first_name
    - id
    - last_name
    type: object
  models.UserListResponse:
    properties:
      limit:
        description: Items per page
        type: integer
      page:
        description: Current page
        type: integer
      total:
        description: Total count of users
        type: integer
      total_pages:
        description: Total pages
        type: integer
      users:
        items:
          $ref: '#/definitions/models.User'
        type: array
    type: object
  models.UserSession:
    properties:
      browser:
        type: string
      device_id:
        type: string
      device_os:
        type: string
      ip_address:
        type: string
      is_active:
        type: boolean
      last_active:
        type: string
      login_time:
        type: string
      logout_time:
        type: string
      session_id:
        type: string
      user_id:
        type: string
    type: object
  models.VerifyEmailRequestDto:
    properties:
      email:
        type: string
    type: object
  models.VerifyEmailToken:
    properties:
      token:
        type: string
    required:
    - token
    type: object
host: localhost:8080
info:
  contact: {}
  description: Swagger Documentation for API REST
  title: API REST
  version: "1.0"
paths:
  /auth/email/verification:
    post:
      consumes:
      - application/json
      description: Generate and send email verification token
      parameters:
      - description: Bearer Token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Email data
        in: body
        name: request
        schema:
          $ref: '#/definitions/models.VerifyEmailRequestDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.VerifyEmailToken'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Request email verification
      tags:
      - Auth
    put:
      consumes:
      - application/json
      description: Confirm email address with verification token
      parameters:
      - description: Verification token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.VerifyEmailToken'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: boolean
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Confirm email address
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Allow login based on email authentication, email can be confirmed
        after login
      parameters:
      - description: Datos de usuario
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.LoginUserRequestDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.LoginSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Allow login based on email authentication, email can be confirmed after
        login
      tags:
      - Auth
  /auth/login/facebook:
    post:
      consumes:
      - application/json
      description: Allow login based on Facebook authentication
      parameters:
      - description: Datos de usuario
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.LoginExternalRequestDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.LoginSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Allow login based on Facebook authentication
      tags:
      - Auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Logout
      parameters:
      - description: Bearer Token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: boolean
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Logout
      tags:
      - Auth
  /auth/password:
    put:
      consumes:
      - application/json
      description: Change password for authenticated user
      parameters:
      - description: Bearer Token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Password data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.ChangePasswordRequestDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: boolean
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Change user password
      tags:
      - Auth
  /auth/password/reset:
    post:
      consumes:
      - application/json
      description: Generate and send password reset token
      parameters:
      - description: Account data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.PasswordResetRequestDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.PasswordResetTokenRequestDto'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Request password reset
      tags:
      - Auth
    put:
      consumes:
      - application/json
      description: Reset password using reset token
      parameters:
      - description: Reset data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.PasswordResetWithTokenDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: boolean
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Reset password with token
      tags:
      - Auth
  /auth/profile:
    get:
      consumes:
      - application/json
      description: Get authenticated user profile information
      parameters:
      - description: Bearer Token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get user profile
      tags:
      - Auth
    patch:
      consumes:
      - application/json
      description: Update authenticated user profile information (partial updates
        allowed)
      parameters:
      - description: Bearer Token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Profile data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.UpdateProfileDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Update user profile
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Register
      parameters:
      - description: User
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/josex_web_modules_auth_models.CreateUserDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Register
      tags:
      - Auth
  /auth/sessions:
    delete:
      consumes:
      - application/json
      description: Logout all sessions for authenticated user except current one
      parameters:
      - description: Bearer Token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: integer
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Logout all sessions
      tags:
      - Sessions
    get:
      consumes:
      - application/json
      description: Get all sessions (active and inactive) for authenticated user
      parameters:
      - description: Bearer Token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.UserSession'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get active sessions
      tags:
      - Sessions
  /auth/sessions/{id}:
    delete:
      consumes:
      - application/json
      description: Logout a specific session by ID (must belong to authenticated user)
      parameters:
      - description: Bearer Token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Session ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Logout specific session
      tags:
      - Sessions
  /auth/token/refresh:
    post:
      consumes:
      - application/json
      description: Refresh access token using refresh token and validate active session
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.RefreshTokenRequestDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.RefreshTokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Refresh access token
      tags:
      - Auth
  /users:
    get:
      consumes:
      - application/json
      description: Get paginated list of users with optional search and filters
      parameters:
      - description: Bearer Token
        in: header
        name: Authorization
        required: true
        type: string
      - description: 'Page number (default: 1)'
        in: query
        minimum: 1
        name: page
        type: integer
      - description: 'Items per page (default: 20, max: 100)'
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: Search in email, first name, last name
        in: query
        name: search
        type: string
      - description: Filter by status
        enum:
        - active
        - inactive
        - expired
        in: query
        name: status
        type: string
      - description: 'Sort field (default: created_at)'
        enum:
        - created_at
        - email
        - first_name
        - last_name
        in: query
        name: sort
        type: string
      - description: 'Sort order (default: desc)'
        enum:
        - asc
        - desc
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.UserListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: List users with pagination and filters
      tags:
      - Users
  /users/{id}:
    delete:
      consumes:
      - application/json
      description: Soft delete a user (sets deleted_at timestamp and invalidates sessions).
        Respects ALLOW_USER_DELETION and ENABLE_SOFT_DELETE config.
      parameters:
      - description: Bearer Token
        in: header
        name: Authorization
        required: true
        type: string
      - description: User ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Deletion details
        in: body
        name: request
        schema:
          $ref: '#/definitions/models.SoftDeleteUserDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "403":
          description: User deletion is disabled
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Soft delete user
      tags:
      - Users
    get:
      consumes:
      - application/json
      description: Get a single user by their ID
      parameters:
      - description: Bearer Token
        in: header
        name: Authorization
        required: true
        type: string
      - description: User ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get user by ID
      tags:
      - Users
swagger: "2.0"
