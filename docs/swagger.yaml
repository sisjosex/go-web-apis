        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/josex_web_modules_core_errors.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/josex_web_modules_core_errors.ErrorResponse'
      security:
