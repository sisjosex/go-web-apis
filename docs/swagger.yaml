info:
  contact: {}
  description: Swagger Documentation for API REST
  title: API REST
  version: "1.0"
paths:
  /auth/email/verification:
    post:
      consumes:
      - application/json
      description: Generate and send email verification token
      parameters:
      - description: Bearer Token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Email data
        in: body
        name: request
        schema:
          $ref: '#/definitions/models.VerifyEmailRequestDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.VerifyEmailToken'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Request email verification
      tags:
      - Auth
    put:
      consumes:
      - application/json
      description: Confirm email address with verification token
      parameters:
      - description: Verification token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.VerifyEmailToken'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: boolean
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Confirm email address
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Allow login based on email authentication, email can be confirmed
        after login
      parameters:
      - description: Datos de usuario
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.LoginUserRequestDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.LoginSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Allow login based on email authentication, email can be confirmed after
        login
      tags:
      - Auth
  /auth/login/facebook:
    post:
      consumes:
