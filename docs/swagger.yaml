            $ref: '#/definitions/josex_web_modules_core_errors.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/josex_web_modules_core_errors.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Dry-run validate an uploaded CSV
      tags:
      - Import
