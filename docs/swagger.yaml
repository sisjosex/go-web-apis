  /import:
    post:
      consumes:
      - multipart/form-data
      description: Detects the resource, creates each valid row, and returns per-row
        created|failed|skipped outcomes plus a persisted run summary (who/when/counts/warnings).
      parameters:
      - description: Bearer Token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Tenant slug
        in: header
        name: X-Tenant-Slug
        required: true
        type: string
      - description: CSV file (max 5 MB, 500 rows)
        in: formData
        name: file
        required: true
        type: file
      - description: Resource key (auto-detected from the header when omitted)
        in: formData
        name: resource
        type: string
      - description: Comma-separated resource or module keys detection is limited
          to (e.g. inventory)
        in: formData
        name: scope
        type: string
      - description: Resource-specific options as a JSON object
        in: formData
        name: options
        type: string
      - description: Optional ZIP of images referenced by the CSV (e.g. profile_picture)
        in: formData
        name: images
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/josex_web_modules_import_models.ImportResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/josex_web_modules_core_errors.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/josex_web_modules_core_errors.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Process an uploaded CSV
      tags:
      - Import
  /import/detect:
    post:
      consumes:
      - multipart/form-data
      description: Resolves the resource a CSV belongs to from its header line alone,
        inside the optional scope, without reading or validating any row — so a client
        can queue several files in import order before running them.
      parameters:
      - description: Bearer Token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Tenant slug
        in: header
        name: X-Tenant-Slug
        required: true
        type: string
      - description: CSV file (max 5 MB)
        in: formData
        name: file
        required: true
        type: file
      - description: Comma-separated resource or module keys detection is limited
          to (e.g. inventory)
        in: formData
        name: scope
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/josex_web_modules_import_models.DetectResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/josex_web_modules_core_errors.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/josex_web_modules_core_errors.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Detect a CSV's resource
      tags:
      - Import
  /import/meta:
    get:
      description: Returns the configured upload constraints (max file size, max rows)
        so the UI hint stays in sync with the server.
      parameters:
      - description: Bearer Token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Tenant slug
        in: header
        name: X-Tenant-Slug
        required: true
        type: string
      produces:
