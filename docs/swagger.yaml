            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/josex_web_modules_core_errors.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Resources a scope reaches
      tags:
      - Import
  /import/schema:
    get:
      description: Returns the resource's columns with their type, required flag and
        optional validation pattern, so a client can render and check an editor per
        column without knowing the resource.
      parameters:
      - description: Bearer Token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Tenant slug
        in: header
        name: X-Tenant-Slug
        required: true
        type: string
      - description: Resource key (e.g. users)
        in: query
        name: resource
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/josex_web_modules_import_models.SchemaResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/josex_web_modules_core_errors.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/josex_web_modules_core_errors.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Column schema for a resource
      tags:
      - Import
  /import/template:
    get:
      description: Returns a CSV containing just the header row for a resource, built
