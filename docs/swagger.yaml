host: localhost:8080
info:
  contact: {}
  description: Modular API server. Run in platform or tenant mode via -mode flag.
  title: Go Web API
  version: "1.0"
paths:
  /api/v1/inventory/categories:
    get:
      description: Retrieve a paginated list of product categories (optionally filtered
        by parent)
      parameters:
      - description: Parent category ID
        in: query
        name: parent_id
        type: string
      - description: Filter by active status
        in: query
        name: is_active
        type: boolean
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/josex_web_modules_inventory_models.ListCategoriesResponse'
      summary: List product categories
      tags:
      - inventory-categories
    post:
      consumes:
      - application/json
      description: Create a new product category with hierarchical support
      parameters:
      - description: Category creation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/josex_web_modules_inventory_models.CreateCategoryDto'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/josex_web_modules_inventory_models.CategoryResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
      summary: Create a new product category
      tags:
      - inventory-categories
  /api/v1/inventory/categories/:id:
    delete:
      description: Soft delete a product category (cannot have products assigned)
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Delete a product category
      tags:
      - inventory-categories
    get:
      description: Retrieve a single product category by ID with product count
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/josex_web_modules_inventory_models.CategoryResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Get a product category
      tags:
      - inventory-categories
    put:
      consumes:
      - application/json
      description: Update an existing product category
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      - description: Category update request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/josex_web_modules_inventory_models.UpdateCategoryDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/josex_web_modules_inventory_models.CategoryResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Update a product category
      tags:
      - inventory-categories
  /api/v1/inventory/categories/:id/products:
    get:
      description: Retrieve all products assigned to a specific category
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/josex_web_modules_inventory_models.GetProductsByCategoryResponse'
            type: array
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Get products in category
      tags:
      - inventory-categories
  /api/v1/inventory/categories/search:
    get:
      description: Search categories by name, slug, or description
      parameters:
      - description: Search term
        in: query
        name: search_term
        required: true
        type: string
      - description: Filter by active status
        in: query
        name: is_active
        type: boolean
      - default: 50
        description: Results limit
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/josex_web_modules_inventory_models.CategoryResponse'
            type: array
      summary: Search product categories
      tags:
      - inventory-categories
  /api/v1/inventory/movements:
    get:
      description: Paginated movement history, optionally filtered by product, type
        and date range
      parameters:
      - description: Product ID
        in: query
        name: product_id
        type: string
      - description: Movement type (PURCHASE, SALE, ADJUSTMENT, TRANSFER, RETURN,
          WASTE, PRODUCTION)
        in: query
        name: movement_type
        type: string
      - description: Inclusive lower bound, YYYY-MM-DD
        in: query
        name: date_from
        type: string
      - description: Inclusive upper bound, YYYY-MM-DD
        in: query
        name: date_to
        type: string
      - default: 1
        description: Page number, 1-based
        in: query
        name: page
        type: integer
      - default: 20
        description: Rows per page, max 100
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/josex_web_modules_inventory_models.ListMovementsResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: List inventory movements
      tags:
      - inventory
    post:
      consumes:
      - application/json
      description: Record a stock movement (purchase, sale, adjustment, etc.)
      parameters:
      - description: Movement request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/josex_web_modules_inventory_models.RecordMovementDto'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/josex_web_modules_inventory_models.RecordMovementResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
      summary: Record an inventory movement
      tags:
      - inventory
  /api/v1/inventory/movements/:id:
    get:
      description: Retrieve a specific inventory movement
      parameters:
      - description: Movement ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/josex_web_modules_inventory_models.InventoryMovement'
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Get movement by ID
      tags:
      - inventory
  /api/v1/inventory/products:
    get:
      description: Retrieve a paginated list of active products, each with the categories
        it is filed under. Optionally narrowed to one category and/or a name/SKU search.
      parameters:
      - description: Limit (default 20)
        in: query
        name: limit
        type: integer
      - description: Offset (default 0)
        in: query
        name: offset
        type: integer
      - description: Only products assigned to this category
        in: query
        name: category_id
        type: string
      - description: Case-insensitive match on name or SKU
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/josex_web_modules_inventory_models.Product'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: List all products
      tags:
      - inventory
    post:
      consumes:
      - application/json
      description: Create a new product with optional variants (groups and options)
      parameters:
      - description: Product creation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/josex_web_modules_inventory_models.CreateProductDto'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/josex_web_modules_inventory_models.CreateProductResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
      summary: Create a product with variants
      tags:
      - inventory
  /api/v1/inventory/products/:id:
    get:
      description: Retrieve a product with all its details
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/josex_web_modules_inventory_models.ProductDetail'
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Get product by ID
      tags:
      - inventory
    put:
      consumes:
      - application/json
      description: 'Update name, description and base price, and diff the variant
        tree by id. Omitting "variants" leaves the tree untouched; {"groups": []}
        removes every group. The SKU is immutable.'
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      - description: Product update request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/josex_web_modules_inventory_models.UpdateProductDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/josex_web_modules_inventory_models.UpdateProductResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
      summary: Update a product and its variants
      tags:
      - inventory
  /api/v1/inventory/products/:id/categories:
    get:
      description: Retrieve all categories a specific product is assigned to
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 100
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/josex_web_modules_inventory_models.CategoryResponse'
            type: array
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Get categories of a product
      tags:
      - inventory-categories
  /api/v1/inventory/products/:id/media:
    post:
      consumes:
      - application/json
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      - description: Media data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/josex_web_modules_inventory_models.AddProductMediaDto'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/josex_web_modules_inventory_models.AddProductMediaResponse'
      summary: Add media to a product or variant option
      tags:
      - inventory
  /api/v1/inventory/products/:id/media/:media_id:
    delete:
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      - description: Media ID
        in: path
        name: media_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Remove a media item from a product
      tags:
      - inventory
  /api/v1/inventory/products/:product_id/reorder-level:
    patch:
      consumes:
      - application/json
      description: Update the minimum stock level for a product
      parameters:
      - description: Product ID
        in: path
        name: product_id
        required: true
        type: string
      - description: Reorder level request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/josex_web_modules_inventory_models.UpdateReorderLevelDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/josex_web_modules_inventory_models.UpdateReorderLevelResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Update product reorder level
      tags:
      - inventory
  /api/v1/inventory/products/:productId/categories/:id:
    delete:
      description: Remove a product from a category
      parameters:
      - description: Product ID
        in: path
        name: productId
        required: true
        type: string
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Remove product from category
      tags:
      - inventory-categories
    post:
      consumes:
      - application/json
      description: Assign a product to a category
      parameters:
      - description: Product ID
        in: path
        name: productId
        required: true
        type: string
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
