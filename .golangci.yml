# golangci-lint v2 — run through `make lint` (changed code only) or `make lint-all`.
# What gofmt/vet cannot judge and .claude/rules/go.md used to say in prose.
version: "2"

linters:
  default: none
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - forbidigo
    - funlen
    - gocyclo
    - rowserrcheck
    - sqlclosecheck
    - bodyclose
  settings:
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^context\.Background$
          msg: ctx flows down from c.Request.Context(); context.Background() only in startup or fire-and-forget code (go.md)
        - pattern: ^context\.TODO$
          msg: pass the request context (go.md)
    funlen:
      lines: 80
      statements: 50
    gocyclo:
      min-complexity: 15
  exclusions:
    rules:
      # Entry points and tests may create root contexts and be long.
      - path: ^cmd/|_test\.go$|/tests/
        linters: [forbidigo, funlen, gocyclo]
      # Swagger output is generated.
      - path: ^docs/
        linters: [govet, errcheck, staticcheck, unused, funlen, gocyclo]

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
