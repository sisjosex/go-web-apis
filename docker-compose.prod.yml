# Production stack. Only Caddy publishes a host port; PostgreSQL, Valkey, both
# APIs, the worker and the scheduler live on the compose network alone.
#
# Variables come from `.env` beside this file (see .env.example → DEPLOY), the
# per-server settings from `.env.platform` / `.env.tenant`. Both of those must
# point DATABASE_URL at the `postgres` service, not at localhost.
#
# Default: the platform server and everything it needs on one box (INFRA-006):
# PostgreSQL, Valkey, api-platform, api-realtime, worker, scheduler, Valhalla,
# backup, Caddy. The tenant-mode server — api-tenant and its migrate job — is
# for a dedicated box and starts with COMPOSE_PROFILES=tenant in `.env`.
#
# The API image comes from GHCR, built by CI on every push to master; API_TAG in
# `.env` pins the commit that runs (docker/README.md → Deploy).
#
#   docker compose -f docker-compose.prod.yml pull --ignore-buildable
#   docker compose -f docker-compose.prod.yml up -d

name: xanthops

# Sized for one box, 6 vCPU / 12 GB (INFRA-004, docker/README.md has the table):
# PostgreSQL 2 GB of buffers and ~1 GB of connection work, Valhalla 1 GB, Valkey
# 0.5 GB, the five Go processes 2.8 GB under a hard limit each with GOMEMLIMIT
# just below it, Caddy 0.25 GB — ~4 GB stay with the kernel as page cache.
# No CPU quotas: a quota on 6 cores leaves cores idle; cpu_shares only weigh
# who wins under contention (PostgreSQL 2048, APIs 1024, the rest 512).

# Every container logs through json-file with a cap (D3): at most 5 × 20 MB
# each, compressed, so the disk never fills and nothing else has to rotate.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"
    compress: "true"

services:
  postgres:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    # Memory and I/O settings for this box (D2): 2 GB of buffers, 6 GB the planner may
    # assume cached, NVMe costs, no JIT for short SP calls, checkpoints every 2 GB of
    # WAL, 200 connections for the pool budget (D1), a 500 ms slow-query line and
    # pg_stat_statements as the profiler. Parallel workers share memory through
    # /dev/shm, which Docker caps at 64 MB unless shm_size says otherwise.
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=6GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=200
      - -c
      - max_wal_size=2GB
      - -c
      - min_wal_size=512MB
      - -c
      - wal_compression=lz4
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - max_parallel_workers=4
      - -c
      - max_parallel_workers_per_gather=2
      - -c
      - jit=off
      - -c
      - log_min_duration_statement=500ms
      - -c
      - shared_preload_libraries=pg_stat_statements
    shm_size: 256m
    cpu_shares: 2048
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # The tenant server's own database — nothing in the API creates it.
      POSTGRES_EXTRA_DBS: ${TENANT_POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-extra-databases.sh:/docker-entrypoint-initdb.d/10-extra-databases.sh:ro
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/20-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ============ VALKEY (queues, rate limit — INFRA-001) ============
  # Nothing here is the only copy of business data (the outbox is in PostgreSQL),
  # but AOF everysec keeps queued jobs across a restart, losing at most a second.
  # maxmemory noeviction: a queue or a GPS stream is never silently dropped — a full
  # Valkey refuses writes, the ingest stores inline and /readyz says degraded.
  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction", "--requirepass", "${VALKEY_PASSWORD}"]
    mem_limit: 640m
    cpu_shares: 512
    logging: *logging
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$VALKEY_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}

  # ============ MIGRATE JOBS (one-shot, run before the servers) ============
  # The servers start with SKIP_MIGRATIONS=true: with more than one replica,
  # every replica migrating on boot races on the same schema. These jobs run
  # once, exit non-zero on failure, and the servers wait for them.

  migrate:
    image: ghcr.io/sisjosex/api:${API_TAG:-latest}
    restart: "no"
    logging: *logging
    env_file:
      - .env.platform
    environment:
      ENV_FILE: .env.platform
    # Platform schema first, then every tenant database registered in it.
    command: ["sh", "-c", "./cli migrate && ./cli tenant -migrate all"]
    depends_on:
      postgres:
        condition: service_healthy

  migrate-tenant:
    image: ghcr.io/sisjosex/api:${API_TAG:-latest}
    profiles: [tenant]
    restart: "no"
    logging: *logging
    env_file:
      - .env.tenant
    environment:
      ENV_FILE: .env.tenant
    command: ["./cli", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ============ PLATFORM API (Admin) ============
  # Every api-* below: release mode always, LOG_LEVEL from .env (info unless said
  # otherwise), a memory limit with GOMEMLIMIT just under it, and its share of the
  # connection budget (D1): DATABASE_POOL_SIZE to its own database plus
  # TENANCY_DATABASE_POOL_SIZE per tenant database it touches. Idle connections
  # close after 5 min, so the budget is spent on the tenants in use. Stored files
  # live on R2 (INFRA-007): STORAGE_* come in with the env file, no volume holds any.
  api-platform:
    image: ghcr.io/sisjosex/api:${API_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env.platform
    environment:
      ENV_FILE: .env.platform
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      APP_MODE: release
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SKIP_MIGRATIONS: "true"
      GOMEMLIMIT: 420MiB
      DATABASE_POOL_SIZE: "12"
      TENANCY_DATABASE_POOL_SIZE: "4"
    mem_limit: 512m
    cpu_shares: 1024
    logging: *logging
    # The worker and the scheduler run as their own services below.
    command: ["./app", "-mode=platform", "-role=api"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/readyz > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ============ TENANT API (Business) ============
  api-tenant:
    image: ghcr.io/sisjosex/api:${API_TAG:-latest}
    profiles: [tenant]
    restart: unless-stopped
    env_file:
      - .env.tenant
    environment:
      ENV_FILE: .env.tenant
      APP_HOST: 0.0.0.0
      APP_PORT: 9080
      APP_MODE: release
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SKIP_MIGRATIONS: "true"
      GOMEMLIMIT: 640MiB
      DATABASE_POOL_SIZE: "8"
      TENANCY_DATABASE_POOL_SIZE: "8"
    mem_limit: 768m
    cpu_shares: 1024
    logging: *logging
    command: ["./app", "-mode=tenant", "-role=api"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9080/readyz > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      migrate-tenant:
        condition: service_completed_successfully

  # ============ REALTIME GATEWAY (TRACK-025) ============
  # GET /api/v1/tracking/ws only (Caddy routes that path of PLATFORM_HOST here).
  # It resolves each session's tenant database as api-platform does. Its /readyz
  # is 503 while Valkey is unreachable: every socket is closed 1012 then and the
  # clients poll the snapshots until it is back. Scale it freely.
  api-realtime:
    image: ghcr.io/sisjosex/api:${API_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env.platform
    environment:
      ENV_FILE: .env.platform
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      APP_MODE: release
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SKIP_MIGRATIONS: "true"
      GOMEMLIMIT: 420MiB
      DATABASE_POOL_SIZE: "2"
      TENANCY_DATABASE_POOL_SIZE: "3"
    mem_limit: 512m
    cpu_shares: 1024
    logging: *logging
    command: ["./app", "-mode=platform", "-role=realtime"]
    healthcheck: &probe
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/readyz > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on: &jobs-deps
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ============ WORKER & SCHEDULER (INFRA-001) ============
  # Same image, platform mode: both walk every tenant listed in the platform
  # database. They serve only /livez and /readyz, and /readyz is 503 while
  # Valkey is unreachable. Scale api-worker freely; any number of schedulers
  # fire each periodic task once, since only the lease holder fires.
  api-worker:
    image: ghcr.io/sisjosex/api:${API_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env.platform
    environment:
      ENV_FILE: .env.platform
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      APP_MODE: release
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SKIP_MIGRATIONS: "true"
      GOMEMLIMIT: 640MiB
      DATABASE_POOL_SIZE: "4"
      # Plus one LISTEN connection per tenant, outside the pool (outbox relay).
      TENANCY_DATABASE_POOL_SIZE: "6"
      # Only the worker sends pushes (TRACK-012); FCM_PROJECT_ID is in .env.platform.
      FCM_CREDENTIALS_FILE: /run/secrets/fcm.json
    mem_limit: 768m
    cpu_shares: 1024
    logging: *logging
    command: ["./app", "-mode=platform", "-role=worker"]
    volumes:
      - ./secrets/fcm.json:/run/secrets/fcm.json:ro
    # asynq waits up to 8 s for the tasks in flight; the default 10 s stop grace covers it.
    healthcheck: *probe
    depends_on: *jobs-deps

  api-scheduler:
    image: ghcr.io/sisjosex/api:${API_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env.platform
    environment:
      ENV_FILE: .env.platform
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      APP_MODE: release
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SKIP_MIGRATIONS: "true"
      GOMEMLIMIT: 200MiB
      DATABASE_POOL_SIZE: "2"
      TENANCY_DATABASE_POOL_SIZE: "2"
    mem_limit: 256m
    cpu_shares: 512
    logging: *logging
    command: ["./app", "-mode=platform", "-role=scheduler"]
    healthcheck: *probe
    depends_on: *jobs-deps

  # ============ BACKUP ============
  # Nightly pg_dump of every database in pg_database to S3-compatible storage.
  # Restore steps: docker/backup/README.md
  backup:
    build:
      context: ./docker/backup
    restart: unless-stopped
    cpu_shares: 512
    logging: *logging
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 3 * * *}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_HEARTBEAT_URL: ${BACKUP_HEARTBEAT_URL:-}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_KEY}
      AWS_DEFAULT_REGION: ${BACKUP_S3_REGION:-us-east-1}
    depends_on:
      postgres:
        condition: service_healthy

  # ============ GEO (INFRA-003) ============
  # Routing on the build in ${GEO_DATA_DIR}/current, uploaded and put live by
  # docker/geo/switch.sh — the server never builds (D3). Read-only and
  # stateless; the API reaches it on the compose network only. A 4 GB
  # box wants 2 GB of swap for the peaks (docker/geo/README.md).
  valhalla:
    image: ghcr.io/valhalla/valhalla:3.9.0
    restart: unless-stopped
    command: ["valhalla_service", "/valhalla/valhalla.json", "2"]
    mem_limit: 1g
    cpu_shares: 512
    logging: *logging
    volumes:
      - ${GEO_DATA_DIR:-./docker/geo/data}/current/valhalla:/valhalla:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:8002/status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ============ EDGE ============
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    mem_limit: 256m
    cpu_shares: 512
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # A host given as http://… (an IP with no domain yet) is served on :80 only, no
      # certificate. Without the tenant profile its site answers a name nobody resolves.
      PLATFORM_HOST: ${PLATFORM_HOST}
      TILES_HOST: ${TILES_HOST}
      TENANT_HOST: ${TENANT_HOST:-http://tenant.invalid}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docker/caddy/tiles.caddy:/etc/caddy/tiles.caddy:ro
      # The basemap at the root of TILES_HOST (docker/caddy/tiles.caddy).
      - ${GEO_DATA_DIR:-./docker/geo/data}:/srv/geo:ro
      - caddy_data:/data
      - caddy_config:/config
    # Only what every server runs: the tenant upstreams resolve per request.
    depends_on:
      - api-platform

volumes:
  pgdata:
  valkeydata:
  caddy_data:
  caddy_config:
