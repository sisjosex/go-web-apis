# Local stack. Unlike prod, both servers migrate on start — a single replica,
# no job to wait for. The PostgreSQL image is pinned to the one prod runs, so a
# migration is never first tried on a version it was not written against.
services:
  # ============ PLATFORM API (Admin) ============
  platform-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - platform-db
    env_file:
      - .env.platform
    environment:
      - ENV_FILE=.env.platform
      - APP_HOST=0.0.0.0
      - APP_PORT=8080
    command: ["./app", "-mode=platform"]

  platform-db:
    image: postgis/postgis:17-3.5
    restart: always
    container_name: platform-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: web
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  # ============ TENANT API (Business) ============
  tenant-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9080:9080"
    depends_on:
      - tenant-db
    env_file:
      - .env.tenant
    environment:
      - ENV_FILE=.env.tenant
      - APP_HOST=0.0.0.0
      - APP_PORT=9080
    command: ["./app", "-mode=tenant"]

  tenant-db:
    image: postgis/postgis:17-3.5
    restart: always
    container_name: tenant-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tenant_db
    ports:
      - "5433:5432"
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  # ============ VALKEY (queues, rate limit) ============
  # AOF everysec as in prod: a restart keeps the queued jobs.
  valkey:
    image: valkey/valkey:8-alpine
    restart: always
    container_name: valkey
    command: ["valkey-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"

  # ============ GEO (INFRA-003) ============
  # Both serve the build in ${GEO_DATA_DIR}/current (docker/geo/README.md), so
  # they sit behind the `geo` profile: `make docker-up` works before any build
  # exists. `make geo-up` starts them; `make geo-switch` recreates valhalla.
  valhalla:
    image: ghcr.io/valhalla/valhalla:3.9.0
    profiles: [geo]
    restart: always
    command: ["valhalla_service", "/valhalla/valhalla.json", "2"]
    mem_limit: 1g
    # Published in dev only, for the tenant server running outside Docker.
    ports:
      - "8002:8002"
    volumes:
      - ${GEO_DATA_DIR:-./docker/geo/data}/current/valhalla:/valhalla:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:8002/status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # The basemap on :8090 — prod serves the same snippet under TENANT_HOST/tiles/.
  tiles:
    image: caddy:2.8-alpine
    profiles: [geo]
    restart: always
    ports:
      - "8090:8090"
    volumes:
      - ./docker/caddy/Caddyfile.tiles:/etc/caddy/Caddyfile:ro
      - ./docker/caddy/tiles.caddy:/etc/caddy/tiles.caddy:ro
      - ${GEO_DATA_DIR:-./docker/geo/data}:/srv/geo:ro
