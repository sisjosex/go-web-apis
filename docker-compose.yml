# Local stack. Unlike prod, both servers migrate on start — a single replica,
# no job to wait for. The PostgreSQL image is pinned to the one prod runs, so a
# migration is never first tried on a version it was not written against.
services:
  # ============ PLATFORM API (Admin) ============
  platform-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - platform-db
    env_file:
      - .env.platform
    environment:
      - ENV_FILE=.env.platform
      - APP_HOST=0.0.0.0
      - APP_PORT=8080
    command: ["./app", "-mode=platform"]

  platform-db:
    image: postgis/postgis:17-3.5
    restart: always
    container_name: platform-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: web
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  # ============ TENANT API (Business) ============
  tenant-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9080:9080"
    depends_on:
      - tenant-db
    env_file:
      - .env.tenant
    environment:
      - ENV_FILE=.env.tenant
      - APP_HOST=0.0.0.0
      - APP_PORT=9080
    command: ["./app", "-mode=tenant"]

  tenant-db:
    image: postgis/postgis:17-3.5
    restart: always
    container_name: tenant-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tenant_db
    ports:
      - "5433:5432"
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  # ============ VALKEY (queues, rate limit) ============
  # AOF everysec as in prod: a restart keeps the queued jobs.
  valkey:
    image: valkey/valkey:8-alpine
    restart: always
    container_name: valkey
    command: ["valkey-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
