# Local stack. Unlike prod, both servers migrate on start — a single replica,
# no job to wait for. The PostgreSQL image is pinned to the one prod runs, so a
# migration is never first tried on a version it was not written against.
services:
  # ============ PLATFORM API (Admin) ============
  platform-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - platform-db
    env_file:
      - .env.platform
    environment:
      - ENV_FILE=.env.platform
      - APP_HOST=0.0.0.0
      - APP_PORT=8080
    command: ["./app", "-mode=platform"]

  platform-db:
    image: postgis/postgis:17-3.5
    restart: always
    container_name: platform-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: web
    ports:
      # 5434 on the host: local development runs on the native PostgreSQL 16 service, which owns
      # 5432. Publishing this one there too made whichever server bound first answer for both.
      - "5434:5432"
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  # ============ TENANT API (Business) ============
  tenant-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9080:9080"
    depends_on:
      - tenant-db
    env_file:
      - .env.tenant
    environment:
      - ENV_FILE=.env.tenant
      - APP_HOST=0.0.0.0
      - APP_PORT=9080
    command: ["./app", "-mode=tenant"]

  tenant-db:
    image: postgis/postgis:17-3.5
    restart: always
    container_name: tenant-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tenant_db
    ports:
      - "5433:5432"
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  # ============ VALKEY (queues, rate limit) ============
  # AOF everysec as in prod: a restart keeps the queued jobs.
  valkey:
    image: valkey/valkey:8-alpine
    restart: always
    container_name: valkey
    command: ["valkey-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"

  # ============ STORAGE (INFRA-007 D3) ============
  # A local S3 standing in for Cloudflare R2: the same client, keys and signed URLs. The browser
  # reaches it straight on :8333, as it reaches R2 in production. Anonymous reads cover the media
  # buckets only (docker/seaweedfs/s3.json); storage-init creates the buckets once.
  storage:
    image: chrislusf/seaweedfs:4.48
    restart: always
    container_name: storage
    command: ["server", "-s3", "-s3.config=/etc/seaweedfs/s3.json", "-dir=/data", "-volume.max=0"]
    ports:
      - "8333:8333"
    volumes:
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - storage-data:/data

  storage-init:
    image: chrislusf/seaweedfs:4.48
    depends_on:
      - storage
    restart: "no"
    entrypoint: ["sh", "/init.sh"]
    volumes:
      - ./docker/seaweedfs/init.sh:/init.sh:ro

  # ============ GEO (INFRA-003) ============
  # Both serve the build in ${GEO_DATA_DIR}/current (docker/geo/README.md), so
  # they sit behind the `geo` profile: `make docker-up` works before any build
  # exists. `make geo-up` starts them; `make geo-switch` recreates valhalla.
  valhalla:
    image: ghcr.io/valhalla/valhalla:3.9.0
    profiles: [geo]
    restart: always
    command: ["valhalla_service", "/valhalla/valhalla.json", "2"]
    mem_limit: 1g
    # Published in dev only, for the tenant server running outside Docker.
    ports:
      - "8002:8002"
    volumes:
      - ${GEO_DATA_DIR:-./docker/geo/data}/current/valhalla:/valhalla:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:8002/status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # The basemap on :8090 — prod serves the same snippet under TENANT_HOST/tiles/.
  tiles:
    image: caddy:2.8-alpine
    profiles: [geo]
    restart: always
    ports:
      - "8090:8090"
    volumes:
      - ./docker/caddy/Caddyfile.tiles:/etc/caddy/Caddyfile:ro
      - ./docker/caddy/tiles.caddy:/etc/caddy/tiles.caddy:ro
      - ${GEO_DATA_DIR:-./docker/geo/data}:/srv/geo:ro

volumes:
  storage-data:
